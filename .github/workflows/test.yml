name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  # server.py imports the SDK with a fallback for mcp 1.x. Run the suite on a real 1.x
  # install so a change that only works on 2.x fails here instead of for users on 1.x.
  pytest-mcp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras on mcp 1.x
        run: pip install -e ".[dev]" "mcp<2"
      - name: Run tests
        run: pytest
